<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GovArchive | Government Policy &amp; Document Portal</title>
<style>
  :root{
    --navy:#0F172A; --slatebg:#F8FAFC; --accent:#2563EB; --accent-hover:#1d4ed8;
    --emerald:#10B981; --slate100:#F1F5F9; --slate200:#E2E8F0; --slate300:#CBD5E1;
    --slate400:#94A3B8; --slate500:#64748B; --slate600:#475569; --slate700:#334155;
    --slate800:#1E293B; --slate900:#0F172A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--slatebg);color:var(--slate800);line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}
  mark.kw{background:#FEF08A;color:#78350F;padding:0 2px;border-radius:2px;font-weight:600}

  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
  .hidden{display:none}

  /* header */
  header.app{background:var(--navy);color:#fff}
  .hbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 24px;max-width:1200px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:44px;height:44px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px}
  .brand h1{font-size:19px;font-weight:700;line-height:1.2}
  .brand h1 span{color:var(--slate400);font-weight:400}
  .brand p{font-size:12px;color:var(--slate400)}
  .hright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .awsbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--slate300)}
  .awsbadge .dot{color:var(--emerald)}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;border:none}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-ghost{background:transparent;color:var(--slate600)}
  .btn-ghost:hover{background:var(--slate100)}
  .btn-soft{background:var(--slate100);color:var(--slate700);font-weight:600;padding:9px 14px;border-radius:10px;border:none}
  .btn-soft:hover{background:var(--slate200)}

  /* search bar */
  section.search{background:#fff;border-bottom:1px solid var(--slate200)}
  .searchinner{padding:20px 24px;max-width:1200px;margin:0 auto}
  .searchfield{position:relative}
  .searchfield .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--slate400);font-size:18px}
  .searchfield input{width:100%;padding:12px 16px 12px 42px;border:1px solid var(--slate300);border-radius:12px;font-size:14px;outline:none}
  .searchfield input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
  .filters{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
  .filt{display:inline-flex;align-items:center;gap:8px;background:var(--slatebg);border:1px solid var(--slate200);border-radius:10px;padding:8px 12px}
  .filt label{font-size:12px;color:var(--slate500)}
  .filt select{font-size:14px;font-weight:600;background:transparent;border:none;outline:none;cursor:pointer;color:var(--slate800)}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
  .chips .lbl{font-size:12px;font-weight:600;color:var(--slate500);margin-right:4px}
  .chip{font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--slate100);border:1px solid var(--slate200);color:var(--slate700)}
  .chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* layout */
  main.layout{display:flex;gap:24px;max-width:1200px;margin:0 auto;padding:24px;align-items:flex-start}
  aside.side{width:260px;flex:0 0 auto}
  .side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .side-head h2{font-size:12px;font-weight:700;color:var(--slate700);letter-spacing:.05em;text-transform:uppercase}
  .side-head button{color:var(--accent);background:none;border:none;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .folder{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--slate200);background:#fff;text-align:left;margin-bottom:8px}
  .folder:hover{background:var(--slatebg);border-color:var(--slate300)}
  .folder.active{background:rgba(37,99,235,.08);border-color:var(--accent)}
  .folder .fi{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
  .folder .ft{flex:1;min-width:0}
  .folder .ft .nm{display:block;font-size:14px;font-weight:600;color:var(--slate800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .folder .ft .ct{display:block;font-size:12px;color:var(--slate400)}

  section.feed{flex:1;min-width:0}
  .feedcount{font-size:14px;color:var(--slate500);margin-bottom:12px}
  .card{background:#fff;border:1px solid var(--slate200);border-radius:12px;padding:16px;margin-bottom:12px}
  .card:hover{box-shadow:0 4px 14px rgba(15,23,42,.08)}
  .card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid}
  .badge.solid{color:#fff}
  .filecode{font-size:12px;color:var(--slate400);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .card h3{margin-top:8px;font-size:16px;font-weight:700;color:var(--slate900)}
  .snippet{margin-top:4px;font-size:14px;color:var(--slate600)}
  .meta{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .meta .tags{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--slate500);flex-wrap:wrap}
  .meta .tags span{display:inline-flex;align-items:center;gap:4px}
  .openbtn{background:none;border:none;color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .openbtn:hover{color:var(--accent-hover)}
  .delbtn{background:none;border:none;color:#DC2626;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .delbtn:hover{color:#991B1B}
  .empty{background:#fff;border:1px solid var(--slate200);border-radius:12px;padding:48px;text-align:center}
  .empty .circ{width:56px;height:56px;border-radius:999px;background:var(--slate100);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px}
  .empty p.big{font-weight:600;color:var(--slate700)}
  .empty p.sm{font-size:14px;color:var(--slate400);margin-top:4px}

  footer.app{max-width:1200px;margin:24px auto 0;padding:24px;border-top:1px solid var(--slate200);font-size:12px;color:var(--slate400)}

  /* drawer */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;animation:fade .15s ease-out}
  .drawer{position:fixed;top:0;right:0;height:100%;width:100%;max-width:560px;background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.2);z-index:50;display:flex;flex-direction:column;animation:slide .2s ease-out}
  .drawer .dhead{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .drawer .dhead h2{font-size:16px;font-weight:700;margin-top:4px}
  .drawer .dmeta{padding:12px 20px;border-bottom:1px solid var(--slate200);display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;color:var(--slate600)}
  .drawer .dmeta span{display:inline-flex;align-items:center;gap:5px}
  .tabs{padding:12px 20px 0;display:flex;gap:4px;border-bottom:1px solid var(--slate200)}
  .tab{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:8px 12px;border:none;background:none;color:var(--slate500);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .dbody{flex:1;overflow-y:auto;padding:16px 20px}
  .dbody pre{white-space:pre-wrap;font-family:inherit;font-size:14px;color:var(--slate700);line-height:1.6}
  .cites{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .cite{font-size:12px;background:#EFF6FF;color:var(--accent);border:1px solid #BFDBFE;border-radius:999px;padding:4px 10px}
  .notice{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:16px;font-size:14px;color:#92400E}
  .notice .nt{font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .briefnote{font-size:12px;display:inline-flex;align-items:center;gap:6px;background:var(--slate100);color:var(--slate500);padding:5px 10px;border-radius:999px;margin-bottom:12px}
  .briefcard{border:1px solid var(--slate200);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .briefcard .bh{padding:8px 12px;font-size:14px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
  .briefcard ul{list-style:none;padding:12px}
  .briefcard li{font-size:14px;color:var(--slate700);display:flex;gap:8px;margin-bottom:6px}
  .briefcard li:last-child{margin-bottom:0}
  .briefcard li .ar{color:var(--slate400);flex:0 0 auto}
  .dfoot{padding:12px 20px;border-top:1px solid var(--slate200);display:flex;align-items:center;justify-content:space-between}
  .dfoot .zh{font-size:12px;color:var(--slate400)}

  /* modal */
  .modalwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;animation:fade .15s ease-out}
  .modal{position:relative;z-index:51;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:640px;margin:32px 0}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--slate200)}
  .mhead h2{font-size:16px;font-weight:700;color:var(--slate900);display:inline-flex;align-items:center;gap:8px}
  .mhead .mi{width:32px;height:32px;border-radius:9px;background:rgba(37,99,235,.1);color:var(--accent);display:flex;align-items:center;justify-content:center}
  .mbody{padding:20px}
  .xbtn{background:none;border:none;color:var(--slate400);font-size:20px;line-height:1}
  .xbtn:hover{color:var(--slate700)}
  .drop{border:2px dashed var(--slate300);border-radius:12px;padding:24px;text-align:center;background:var(--slatebg)}
  .drop.over{border-color:var(--accent);background:#EFF6FF}
  .drop .di{font-size:30px;color:var(--slate400)}
  .drop p{font-size:14px;color:var(--slate600);margin-top:8px}
  .drop .browse{display:inline-block;margin-top:8px;font-size:14px;font-weight:600;color:var(--accent)}
  .filename{margin-top:8px;font-size:14px;font-weight:500;color:var(--slate700);display:inline-flex;align-items:center;gap:6px}
  .tag-ok{font-size:12px;color:var(--emerald);margin-left:4px}
  .tag-warn{font-size:12px;color:#D97706;margin-left:4px}
  .err{font-size:12px;color:#DC2626;margin-top:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .fld label{display:block;font-size:12px;font-weight:600;color:var(--slate600);margin-bottom:4px}
  .fld .req{color:#EF4444}
  .field{width:100%;border:1px solid var(--slate300);border-radius:9px;padding:9px 12px;font-size:14px;outline:none;background:#fff;font-family:inherit}
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tagpill{font-size:12px;background:#EFF6FF;color:var(--accent);border:1px solid #BFDBFE;border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:6px}
  .tagpill button{background:none;border:none;color:var(--accent);font-size:12px}
  .swatches{display:flex;gap:8px}
  .swatch{width:28px;height:28px;border-radius:999px;border:2px solid transparent}
  .swatch.sel{border-color:var(--slate800)}
  .mactions{margin-top:20px;display:flex;justify-content:flex-end;gap:8px}
  .toast{position:fixed;bottom:24px;right:24px;z-index:60;animation:fade .15s ease-out}
  .toast .inner{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);border:1px solid rgba(16,185,129,.4)}
  .toast .ck{color:var(--emerald)}

  #fatal{display:none;max-width:720px;margin:60px auto;padding:24px;border:1px solid #FECACA;background:#FEF2F2;border-radius:12px;color:#991B1B;font-size:14px}
  #fatal h2{font-size:18px;margin-bottom:8px}
  #fatal pre{white-space:pre-wrap;background:#fff;border:1px solid #FECACA;border-radius:8px;padding:12px;margin-top:10px;font-size:12px;color:#7F1D1D}

  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes slide{from{transform:translateX(100%)}to{transform:translateX(0)}}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--slate300);border-radius:6px}

  @media(max-width:860px){
    main.layout{flex-direction:column}
    aside.side{width:100%}
    .drawer{max-width:100%}
    .grid2{grid-template-columns:1fr}
    .drawer .dmeta{grid-template-columns:1fr}
  }
</style>
</head>

  <div id="fatal">
    <h2>Something went wrong loading GovArchive</h2>
    <p>The app hit an error while starting. The details below help pin it down:</p>
    <pre id="fatalmsg"></pre>
    <p style="margin-top:10px">If this mentions a network/CDN load failure, connect to the internet and reload. This prototype loads React from a CDN on first open.</p>
  </div>

  <!-- React (pinned stable versions, development build for clearer errors) -->

  <script>
  // Visible error reporting instead of a blank page.
  function showFatal(msg){
    try{
      document.getElementById('fatalmsg').textContent = String(msg);
      document.getElementById('fatal').style.display = 'block';
    }catch(e){}
  }
  window.addEventListener('error', function(e){ showFatal((e.error && e.error.stack) || e.message); });
  window.addEventListener('unhandledrejection', function(e){ showFatal('Promise rejection: ' + (e.reason && (e.reason.stack||e.reason.message) || e.reason)); });
  </script>

    var MOCK_DOCS=[
      {id:"d1",title:"Emergency Procurement Threshold & Approval Matrix",fileCode:"POL-PROC-2026-01.pdf",
       category:"Policies",department:"Treasury",effectiveDate:"2026-02-14",year:"2026",status:"Verified",format:"pdf",searchable:true,
       tags:["emergency procurement limit","procurement","approval matrix","finance"],
       body:"CLAUSE 1. PURPOSE\nThis policy establishes the Emergency Procurement Limit and the associated approval matrix applicable to all departments during declared emergencies.\n\nCLAUSE 2. EMERGENCY PROCUREMENT LIMIT\n2.1 For a declared emergency, the single-transaction emergency procurement limit is USD 50,000 without prior competitive tender.\n2.2 Any emergency procurement exceeding USD 50,000 requires ratification by the Treasury Approval Board within 72 hours.\n\nCLAUSE 3. APPROVAL MATRIX\n3.1 Up to USD 10,000 - Department Head approval.\n3.2 USD 10,001 to USD 50,000 - Director of Finance approval.\n3.3 Above USD 50,000 - Treasury Approval Board (post-facto ratification permitted in genuine emergencies).\n\nCLAUSE 4. DOCUMENTATION\nAll emergency procurement must be logged in the central registry within five (5) working days, including justification, vendor, and amount.",

       tags:["remote work allowance","remote work","HR","allowance","eligibility"],
       body:"SECTION A. REMOTE WORK ALLOWANCE\nA.1 Eligible employees working remotely for 8 or more days per month qualify for a monthly Remote Work Allowance of USD 120.\nA.2 The allowance covers home internet and electricity contributions and is non-taxable up to the stated cap.\n\nSECTION B. ELIGIBILITY\nB.1 Employees must have completed probation.\nB.2 A signed remote work agreement must be on file with HR.\nB.3 Roles designated as on-site essential are not eligible.\n\nSECTION C. CLAIM PROCESS\nC.1 Submit the monthly remote work log via the HR portal by the 5th of the following month.\nC.2 Line managers approve logs within three (3) working days.",

       tags:["sdec taskforce minutes 2026","sdec","taskforce","minutes"],
       body:"SDEC TASKFORCE MINUTES - QUARTER 1, 2026\nDate: 21 March 2026\nChair: Director, Sustainable Development & Economic Coordination (SDEC)\n\nITEM 1. ATTENDANCE\nQuorum met. Representatives from Treasury, Public Works, and HR present.\n\nITEM 2. DECISIONS\n2.1 Approved the 2026 SDEC taskforce workplan with a focus on infrastructure resilience.\n2.2 Endorsed a joint procurement pilot with Public Works under the emergency procurement framework.\n2.3 Deferred the remote-work expansion proposal pending HR allowance review.\n\nITEM 3. ACTION ITEMS\n3.1 Treasury to confirm budget envelope by 15 April 2026.\n3.2 Public Works to submit resilience project list by 30 April 2026.\n3.3 HR to circulate the updated remote work allowance circular.\n\nITEM 4. NEXT MEETING\nScheduled for 20 June 2026.",

    // ---------- search utilities ----------
    function escapeRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}

    function docMatches(doc,q){
      if(!q)return true;
      var n=q.toLowerCase();
      var f=[doc.title,doc.fileCode,doc.department,doc.category,doc.tags.join(" ")];
      if(doc.searchable)f.push(doc.body);
      for(var i=0;i<f.length;i++){if((f[i]||"").toLowerCase().indexOf(n)!==-1)return true;}
      return false;
    }
    function buildSnippet(doc,q){
      if(!q){var base=doc.searchable?doc.body:doc.tags.join(", ");base=base||"";return base.slice(0,160).trim()+(base.length>160?"...":"");}
      var hs=[];if(doc.searchable)hs.push(doc.body);hs.push(doc.title);hs.push(doc.tags.join(", "));
      var low=q.toLowerCase();
      for(var i=0;i<hs.length;i++){var hStr=hs[i];if(!hStr)continue;var idx=hStr.toLowerCase().indexOf(low);
        if(idx!==-1){var s=Math.max(0,idx-60),e=Math.min(hStr.length,idx+q.length+90);
          return (s>0?"...":"")+hStr.slice(s,e).trim()+(e<hStr.length?"...":"");}}
      var fb=(doc.searchable?doc.body:doc.tags.join(", "));return fb.slice(0,150).trim()+"...";
    }
    function searchDocuments(reg,opt){
      var q=(opt.query||"").trim();
      return reg.filter(function(doc){
        if(opt.category&&opt.category!=="All Categories"&&doc.category!==opt.category)return false;
        if(opt.year&&opt.year!=="All Time"&&doc.year!==opt.year)return false;
        if(opt.department&&opt.department!=="All Departments"&&doc.department!==opt.department)return false;
        return docMatches(doc,q);
      });
    }
    // renders text with yellow <mark> around query matches
    function Highlighted(props){

      return h("span",null,parts.map(function(p,i){
        return p.toLowerCase()===q.toLowerCase()?h("mark",{key:i,className:"kw"},p):h("span",{key:i},p);
      }));
    }

        var ext=extOf(f.name);
        if(ACCEPT.indexOf(ext)===-1){setErrors(Object.assign({},errors,{file:"Unsupported format. Accepted: .txt, .pdf, .doc, .docx"}));setFile(null);setFileText("");return;}
        setErrors(Object.assign({},errors,{file:null}));
        setFile(f);
        if(ext===".txt"){var r=new FileReader();r.onload=function(ev){setFileText(String(ev.target.result||""));};r.readAsText(f);}
        else if(ext===".docx"&&window.mammoth){
          var r2=new FileReader();
          r2.onload=function(ev){
            window.mammoth.extractRawText({arrayBuffer:ev.target.result})
              .then(function(res){setFileText(res.value||"");})
              .catch(function(){setFileText("");});
          };
          r2.readAsArrayBuffer(f);
        }
        else{setFileText("");}
      }


      function addTag(){var t=tagInput.trim();if(t&&tags.indexOf(t)===-1)setTags(tags.concat([t]));setTagInput("");}
      function save(){
        var errs={};
        if(!file)errs.file="Please add a file.";
        if(!category)errs.category="Select a category.";
        if(!effectiveDate)errs.effectiveDate="Pick an effective date.";
        if(!department.trim())errs.department="Enter the issuing department.";
        setErrors(errs);
        for(var k in errs){if(errs[k])return;}
        var ext=extOf(file.name),isTxt=ext===".txt",isDocx=ext===".docx",hasText=(isTxt||isDocx)&&fileText.trim().length>0;
        var ym=effectiveDate.match(/^(\d{4})/);var year=ym?ym[1]:"2026";
        var doc={id:"u"+Date.now(),title:file.name.replace(/\.[^.]+$/,""),fileCode:file.name,category:category,
          department:department.trim(),effectiveDate:effectiveDate,year:year,status:"Pending Review",format:ext.replace(".",""),

          searchable:hasText,tags:tags.length?tags:[category.toLowerCase()],body:hasText?fileText:"",
          citations:hasText?[{label:"Uploaded content",loc:"Page 1"}]:[],
          brief:{"Mandatory Rules":["(Mock brief - generated on filing.)"],"Approval Matrix":["Filed by: "+department.trim()],"Action Steps":["Review uploaded document."]}};
        addDocument(doc);
        fireToast("Document filed to registry: "+file.name);
        onClose();
      }

      var dz=h("div",{className:"drop"+(over?" over":""),
        onDragOver:function(e){e.preventDefault();setOver(true);},
        onDragLeave:function(){setOver(false);},
        onDrop:function(e){e.preventDefault();setOver(false);handleFile(e.dataTransfer.files[0]);}},
        h("div",{className:"di"},"\u2601\uFE0F"),
        h("p",null,"Drag and drop PDF/Word documents here"),
        h("p",{style:{fontSize:"12px",color:"#94A3B8"}},"or"),
        h("label",{className:"browse",style:{cursor:"pointer"}},"Browse files",
          h("input",{type:"file",style:{display:"none"},accept:".txt,.pdf,.doc,.docx",onChange:function(e){handleFile(e.target.files[0]);}})
        ),
        file?h("p",{className:"filename"},"\uD83D\uDCCE "+file.name,
          extOf(file.name)===".txt"?h("span",{className:"tag-ok"},"(text indexed - searchable)"):h("span",{className:"tag-warn"},"(metadata only - body not searchable)")
        ):null,
        errors.file?h("div",{className:"err"},errors.file):null
      );

      var form=h("div",{className:"grid2"},
        FieldRow("Filing Category",true,
          h("select",{className:"field",value:category,onChange:function(e){setCategory(e.target.value);}},
            [h("option",{key:"_",value:""},"Select category...")].concat(categories.map(function(c){return h("option",{key:c.key,value:c.key},c.label);}))
          ),errors.category),
        FieldRow("Effective Date",true,
          h("input",{className:"field",type:"date",value:effectiveDate,onChange:function(e){setEffectiveDate(e.target.value);}}),errors.effectiveDate),
        FieldRow("Issuing Department",true,
          h("input",{className:"field",list:"depl",placeholder:"e.g. Treasury",value:department,onChange:function(e){setDepartment(e.target.value);}}),errors.department),
        FieldRow("Index Keywords / Tags",false,
          h("div",null,
            h("div",{style:{display:"flex",gap:"8px"}},
              h("input",{className:"field",style:{flex:1},placeholder:"Type a tag, press Enter",value:tagInput,
                onChange:function(e){setTagInput(e.target.value);},
                onKeyDown:function(e){if(e.key==="Enter"){e.preventDefault();addTag();}}}),
              h("button",{className:"btn-soft",onClick:addTag},"Add")
            ),
            tags.length?h("div",{className:"taglist"},tags.map(function(t){
              return h("span",{key:t,className:"tagpill"},t,h("button",{onClick:function(){setTags(tags.filter(function(x){return x!==t;}));}},"\u2715"));
            })):null
          ))
      );

      return Modal("Upload & File New Document","\u2B06",onClose,
        h("div",null,
          dz,
          h("datalist",{id:"depl"},DEPARTMENTS.map(function(d){return h("option",{key:d,value:d});})),
          form,
          h("div",{className:"mactions"},
            h("button",{className:"btn btn-ghost",onClick:onClose},"Cancel"),
            h("button",{className:"btn btn-primary",onClick:save},"\uD83D\uDCBE Save & File to Registry")
          )
        )
      );
    }

    // ---------- Create category modal ----------
    function CategoryModal(props){
      var addCategory=props.addCategory, fireToast=props.fireToast, onClose=props.onClose;
      var nState=useState(""); var name=nState[0], setName=nState[1];
      var dState=useState(""); var desc=dState[0], setDesc=dState[1];
      var aState=useState(ACCENT_SWATCHES[0]); var accent=aState[0], setAccent=aState[1];
      var eState=useState(""); var error=eState[0], setError=eState[1];
      function create(){
        if(!name.trim()){setError("Category name is required.");return;}
        addCategory({key:name.trim(),label:name.trim(),accent:accent,emoji:"\uD83D\uDCC1",description:desc.trim()});
        fireToast("New category folder created: "+name.trim());
        onClose();
      }
      return Modal("Create New Category Folder","\uD83D\uDCC1",onClose,
        h("div",null,
          FieldRow("Category Name",true,
            h("input",{className:"field",placeholder:"e.g. Audit Logs, Inter-Agency MoUs",value:name,onChange:function(e){setName(e.target.value);}}),error),
          h("div",{style:{marginTop:"16px"}},
            FieldRow("Description / Scope",false,
              h("textarea",{className:"field",rows:2,placeholder:"What belongs in this folder?",value:desc,onChange:function(e){setDesc(e.target.value);}}))),
          h("div",{style:{marginTop:"16px"}},
            FieldRow("Category Color Accent",false,
              h("div",{className:"swatches"},ACCENT_SWATCHES.map(function(c){
                return h("button",{key:c,className:"swatch"+(accent===c?" sel":""),style:{background:c},onClick:function(){setAccent(c);}});
              })))),
          h("div",{className:"mactions"},
            h("button",{className:"btn btn-ghost",onClick:onClose},"Cancel"),
            h("button",{className:"btn btn-primary",onClick:create},"\uD83D\uDCC1 Create Folder")
          )
        )
      );
    }

    // ---- mount ----
    try{
      var root=ReactDOM.createRoot(document.getElementById("root"));
      root.render(h(App));
    }catch(err){
      showFatal((err&&err.stack)||err);
    }
  })();
  </script>
</body>
</html>
